# Plan Schema — Expected Output from Planner Agents

## YAML Format

```yaml
task_understanding:
  summary: "One-line description of what the planner understood"
  user_goal: "What the user actually wants"
  hidden_requirements: "Implicit requirements the user didn't state"
  non_goals: "What this plan does NOT cover"

assumptions:
  - "SQLite available"
  - "Python 3.10+"

risk_level: low | medium | high

subtasks:
  - id: "T-001"
    title: "Short descriptive title"
    description: "What this subtask does"
    task_type: planning | backend | frontend | data | docs | testing | review | cleanup
    recommended_agent: codex | claude | gemini | opencode | mimo | hermes_self
    fallback_agents:
      - claude
      - opencode
    required_context:
      - "File path or context description"
    expected_artifacts:
      - patch
      - test_log
    depends_on:
      - "T-000"
    user_approval_required: false

execution_order:
  - "T-001"
  - "T-002"
  - "T-003"
  # OR parallel groups:
  - group: 1
    parallel: true
    subtasks: ["T-001", "T-002"]
  - group: 2
    subtasks: ["T-003"]

review_strategy:
  reviewer: claude
  review_required: true
  review_reason: "Security-sensitive change"

fallback_plan:
  if_primary_worker_unavailable: "Use fallback agent from subtask definition"
  if_context_missing: "Ask user for clarification"
  if_tests_fail: "Move to review, then retry or fail"
  if_quota_exceeded: "Switch to lower-tier agent"

next_actions:
  - "After all subtasks complete, run integration test"
  - "Update documentation"
```

## Validation Rules

### Required
- `subtasks` must be non-empty list
- Each subtask must have `id` and `title`
- `id` must be unique across subtasks

### Recommended
- Each subtask should have `recommended_agent`
- `execution_order` should reference valid subtask IDs
- `review_strategy` should specify a reviewer

### Warnings (not errors)
- Missing `task_understanding` — planner should explain what it understood
- Unknown `task_type` — should be one of the valid types
- Missing `depends_on` for subtasks that clearly depend on others

## Auto-Fix Capabilities

The validator can auto-fix:
1. Missing subtask IDs → auto-generate `auto-0`, `auto-1`, ...
2. Missing subtask titles → use description or "Subtask N"
3. Missing `execution_order` → generate from subtask order
4. Missing `task_understanding` → add placeholder

Cannot auto-fix:
- Missing `subtasks` entirely → reject
- All subtasks invalid → reject
