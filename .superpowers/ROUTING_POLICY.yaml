schema_version: "1.0"
policy_id: using-superpowers-v2-default

sources:
  - path: ~/.codex/skills
    note: 217 dirs, Codex runtime
  - path: ~/.config/opencode/skills
    note: 167 dirs + 23 broken addy-* symlinks (skipped)
  - path: ~/.agents/skills
    note: 216 dirs, OpenCode runtime
skip_broken_symlinks: true

models:
  default: opencode/deepseek-v4-flash-free
  retry_same_provider_max: 1
  fallback: opencode/north-mini-code-free
  multimodal: opencode/mimo-v2.5-free
  registered:
    - opencode/deepseek-v4-flash-free
    - opencode/mimo-v2.5-free
    - opencode/north-mini-code-free
    - opencode/laguna-s-2.1-free
    - opencode/ling-3.0-flash-free
    - opencode/nemotron-3-ultra-free
    - opencode/big-pickle
  rules:
    - default_model_for_all_text_and_code_tasks: opencode/deepseek-v4-flash-free
    - use_multimodal_only_when_input_contains_image_or_audio
    - never_use_multimodal_as_default_model
  auth_command: opencode auth login --provider zen

registry:
  refresh_mode: event_driven_plus_ttl
  ttl_seconds: 300
  pin_snapshot_per_task: true
  allow_route_change_only_at_phase_boundary: true
  require_manifest_digest: true
  quarantine_unknown_capabilities: true

preflight:
  required_skill: using-superpowers
  scan_catalog_when_no_exact_match: true
  emit:
    - intent_ir
    - selected_skills
    - route_reasons
    - registry_epoch
    - policy_version
    - budget_envelope
    - acceptance_criteria
    - stop_conditions
  deny_execution_without_record: true

routing:
  max_primary_skills: 5
  max_optional_skills: 3
  max_models_per_task: 2
  hard_filter_before_semantic_score: true
  score_weights:
    semantic_fit: 0.30
    task_mode_fit: 0.15
    artifact_fit: 0.15
    tool_fit: 0.10
    reliability: 0.10
    latency_fit: 0.08
    cost_fit: 0.07
    historical_success: 0.05

roles:
  gate:
    required: [using-superpowers]
    max: 1
  process:
    max: 2
  domain:
    max: 3
  review:
    max: 2
  verify:
    required_for_code_or_external_write: true
    default: verification-before-completion

budgets:
  fast:
    max_input_tokens: 4000
    max_output_tokens: 2000
    max_tool_calls: 20
    max_agents: 0
    compact_at_context_pct: 50
  balanced:
    max_input_tokens: 12000
    max_output_tokens: 6000
    max_tool_calls: 50
    max_agents: 2
    compact_at_context_pct: 50
  deep:
    max_input_tokens: 18000
    max_output_tokens: 10000
    max_tool_calls: 80
    max_agents: 3
    compact_at_context_pct: 50

artifacts:
  tier_0_max_tokens: 80
  tier_1_max_tokens: 200
  tier_2_max_tokens: 1000
  prefer_paths_over_full_content_after_context_pct: 70

permissions:
  default_external_write: deny
  default_destructive_action: deny
  default_secret_access: deny
  community_plugin: quarantine
  require_tool_scope_match: true
  require_user_confirmation_for:
    - publish
    - send_message
    - payment
    - delete
    - push
    - deploy

ambiguity:
  low_risk_threshold: 0.35
  high_risk_threshold: 0.20
  use_grill_me_when_above_threshold: true
  ask_one_question_at_a_time: true
  safe_default_when_no_answer: true

degradation:
  levels:
    L1: full_route_and_verification
    L2: primary_only
    L3: fast_model_and_reduced_context
    L4: plan_or_summary_only
  retry_same_strategy_max: 2
  never_degrade_permissions: true
  never_degrade_acceptance_criteria: true

state_machine:
  allowed:
    inbox: [planning, blocked]
    planning: [planned, blocked, failed]
    planned: [ready, planning, blocked]
    ready: [claimed, blocked]
    claimed: [running, ready, failed]
    running: [review, blocked, failed]
    review: [done, running, failed]
    blocked: [planning, planned, ready, archived]
    failed: [planning, archived]
    done: [archived]
  forbidden:
    - [inbox, done]
    - [running, done]

trust:
  core: {required_health: healthy, allowed_external_write: policy_defined}
  trusted: {required_health: healthy, allowed_external_write: declared_scope}
  community: {required_health: healthy, allowed_external_write: false}
  quarantine: {required_health: manifest_only, allowed_external_write: false}
  blocked: {required_health: none, allowed_external_write: false}
